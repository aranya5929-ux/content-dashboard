<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Calendar Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --red: #E24B4A; --black: #111; --gray-1: #f7f7f7; --gray-2: #eeeeee;
    --gray-3: #cccccc; --gray-4: #888888; --white: #ffffff;
    --border: rgba(0,0,0,0.08); --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  body { font-family: var(--font); background: #f4f4f4; color: var(--black); min-height: 100vh; }
  .page { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }

  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; padding-bottom:20px; border-bottom:2px solid var(--red); }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-bar { width:4px; height:36px; background:var(--red); border-radius:2px; }
  .brand-title { font-size:20px; font-weight:600; }
  .brand-sub { font-size:11px; color:var(--gray-4); margin-top:2px; }
  .btn-refresh { display:flex; align-items:center; gap:6px; padding:8px 18px; background:var(--white); border:1.5px solid var(--red); border-radius:var(--radius-sm); color:var(--red); font-size:13px; font-weight:500; cursor:pointer; transition:.15s; }
  .btn-refresh:hover { background:var(--red); color:var(--white); }
  .btn-refresh:disabled { opacity:.5; pointer-events:none; }

  .metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:20px; }
  .mc { background:var(--white); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:18px 20px; position:relative; overflow:hidden; }
  .mc-top { height:3px; position:absolute; top:0; left:0; right:0; }
  .mc-label { font-size:10px; font-weight:600; letter-spacing:.6px; color:var(--gray-4); margin-top:6px; }
  .mc-val { font-size:32px; font-weight:700; margin:4px 0 2px; line-height:1; }
  .mc-pct { font-size:12px; font-weight:600; }
  .mc-bar-wrap { height:3px; background:var(--gray-2); border-radius:2px; margin-top:10px; }
  .mc-bar-fill { height:3px; border-radius:2px; transition:width .6s ease; }

  .filter-row { background:var(--white); border:0.5px solid var(--border); border-radius:var(--radius-md); padding:14px 18px; margin-bottom:20px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .filter-label { font-size:12px; font-weight:600; color:var(--gray-4); display:flex; align-items:center; gap:4px; }
  .filter-row select { padding:6px 10px; border:1px solid var(--gray-3); border-radius:var(--radius-sm); font-size:12px; font-family:var(--font); color:var(--black); background:var(--white); cursor:pointer; }
  .filter-row select:focus { outline:none; border-color:var(--red); }
  .btn-clear { padding:6px 14px; border:1px solid var(--red); border-radius:var(--radius-sm); background:transparent; color:var(--red); font-size:12px; font-weight:500; cursor:pointer; }
  .btn-clear:hover { background:var(--red); color:var(--white); }
  .filter-count { margin-left:auto; font-size:12px; color:var(--gray-4); }

  .charts-grid { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); gap:14px; margin-bottom:14px; }
  .chart-card { background:var(--white); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:18px 20px; }
  .cc-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cc-title { font-size:11px; font-weight:600; letter-spacing:.5px; color:var(--gray-4); display:flex; align-items:center; gap:5px; }
  .cc-title i { color:var(--red); font-size:15px; }
  .cc-badge { font-size:11px; color:var(--gray-4); background:var(--gray-1); padding:2px 8px; border-radius:20px; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:12px; }
  .legend-item { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--gray-4); }
  .legend-dot { width:9px; height:9px; border-radius:2px; flex-shrink:0; }
  .legend-val { font-weight:600; color:var(--black); }
  .legend-pct { color:var(--gray-3); }

  .table-section { background:var(--white); border:0.5px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; margin-bottom:16px; }
  .table-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1.5px solid var(--red); }
  .t-title { font-size:11px; font-weight:600; letter-spacing:.5px; color:var(--gray-4); display:flex; align-items:center; gap:5px; }
  .t-title i { color:var(--red); font-size:15px; }
  .t-count { font-size:12px; font-weight:600; color:var(--red); }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed; }
  col.c-img { width:48px; } col.c-name { width:200px; } col.c-status { width:130px; }
  col.c-plat { width:120px; } col.c-date { width:90px; } col.c-pillar { width:160px; } col.c-creator { width:100px; }
  thead th { padding:10px 12px; text-align:left; background:var(--gray-1); font-size:10px; font-weight:600; letter-spacing:.5px; color:var(--gray-4); border-bottom:0.5px solid var(--border); white-space:nowrap; }
  tbody td { padding:10px 12px; border-bottom:0.5px solid var(--border); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle; }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:hover td { background:var(--gray-1); }

  .img-thumb { width:38px; height:38px; object-fit:cover; border-radius:6px; border:0.5px solid var(--border); cursor:pointer; display:block; }
  .img-thumb:hover { opacity:.85; }
  .img-ph { width:38px; height:38px; background:var(--gray-1); border-radius:6px; border:0.5px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--gray-3); }
  .badge { display:inline-block; padding:3px 8px; border-radius:20px; font-size:10px; font-weight:600; white-space:nowrap; }
  .s-idea{background:#f1f1f1;color:#555} .s-brief{background:#fef9e7;color:#7a5f00} .s-editing{background:#fef3e7;color:#8b4000}
  .s-review{background:#f0eeff;color:#4a3fb5} .s-ready{background:#eafaf1;color:#1e6b3c} .s-scheduled{background:#e8f4fd;color:#1a5276}
  .s-published{background:#eafaf1;color:#155a30} .s-onhold{background:#f8f9fa;color:#555}
  .s-rab{background:#fde8ec;color:#9b1c2e} .s-truat{background:#e0f7f3;color:#0d5246}
  .ptag { display:inline-block; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:500; margin-right:2px; }
  .pt-fb{background:#e7f0fd;color:#1a56c4} .pt-tt{background:#f0f0f0;color:#111} .pt-ig{background:#fce4ec;color:#ad1457} .pt-sh{background:#fff3e0;color:#bf5000}
  .content-link { font-weight:500; color:var(--black); text-decoration:none; }
  .content-link:hover { color:var(--red); }

  .pager { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; border-top:0.5px solid var(--border); font-size:12px; color:var(--gray-4); }
  .pager-btns { display:flex; gap:4px; }
  .pb { padding:5px 11px; border:1px solid var(--gray-2); border-radius:var(--radius-sm); background:var(--white); color:var(--black); font-size:12px; cursor:pointer; }
  .pb:disabled { opacity:.4; cursor:default; }
  .pb.act { background:var(--red); color:var(--white); border-color:var(--red); }
  .pb:not(:disabled):not(.act):hover { border-color:var(--red); color:var(--red); }

  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:1000; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal-box { background:var(--white); border-radius:var(--radius-lg); padding:22px; max-width:440px; width:92%; position:relative; }
  .modal-close { position:absolute; top:12px; right:14px; background:transparent; border:none; font-size:20px; color:var(--gray-4); cursor:pointer; }
  .modal-close:hover { color:var(--black); }
  .modal-img { width:100%; border-radius:8px; max-height:300px; object-fit:contain; margin-top:4px; }
  .modal-name { font-size:15px; font-weight:600; margin-top:12px; }
  .modal-meta { font-size:11px; color:var(--gray-4); margin-top:6px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .modal-link { margin-top:12px; }
  .modal-link a { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--red); border:1px solid var(--red); padding:6px 14px; border-radius:var(--radius-sm); text-decoration:none; }
  .modal-link a:hover { background:var(--red); color:var(--white); }

  .state-row td { text-align:center; padding:40px; color:var(--gray-4); font-size:13px; }
  .error-row td { text-align:center; padding:30px; color:var(--red); font-size:13px; }

  @media(max-width:768px){
    .metrics{grid-template-columns:repeat(2,1fr)}
    .charts-grid{grid-template-columns:1fr}
    .page{padding:16px}
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="brand">
      <div class="brand-bar"></div>
      <div>
        <div class="brand-title">Content Calendar</div>
        <div class="brand-sub" id="tsBar">กำลังโหลดข้อมูล...</div>
      </div>
    </div>
    <button class="btn-refresh" id="btnRefresh" onclick="loadData()">
      <i class="ti ti-refresh"></i> Refresh
    </button>
  </div>

  <div class="metrics" id="metrics">
    <div class="mc"><div class="mc-top" style="background:#E24B4A"></div><div class="mc-label">TOTAL CONTENT</div><div class="mc-val">—</div></div>
    <div class="mc"><div class="mc-top" style="background:#639922"></div><div class="mc-label">PUBLISHED</div><div class="mc-val">—</div></div>
    <div class="mc"><div class="mc-top" style="background:#378ADD"></div><div class="mc-label">IN PROGRESS</div><div class="mc-val">—</div></div>
    <div class="mc"><div class="mc-top" style="background:#EF9F27"></div><div class="mc-label">SCHEDULED</div><div class="mc-val">—</div></div>
  </div>

  <div class="filter-row">
    <span class="filter-label"><i class="ti ti-filter" style="font-size:14px"></i> กรอง</span>
    <select id="fStatus" onchange="applyFilter()"><option value="">ทุก Status</option></select>
    <select id="fPlatform" onchange="applyFilter()">
      <option value="">ทุก Platform</option>
      <option>Facebook</option><option>Tiktok</option><option>Instagram</option><option>shopee</option>
    </select>
    <select id="fPillar" onchange="applyFilter()"><option value="">ทุก Pillar</option></select>
    <select id="fCreator" onchange="applyFilter()"><option value="">ทุก ผู้จัดทำ</option></select>
    <button class="btn-clear" onclick="clearFilters()">ล้างตัวกรอง</button>
    <span class="filter-count" id="filterCount"></span>
  </div>

  <div class="charts-grid">
    <div class="chart-card">
      <div class="cc-head">
        <div class="cc-title"><i class="ti ti-chart-donut"></i> สถานะคอนเทนต์</div>
        <div class="cc-badge" id="statusTotal">—</div>
      </div>
      <div style="position:relative;height:200px"><canvas id="cStatus" role="img" aria-label="Status chart">Status</canvas></div>
      <div class="legend" id="statusLegend"></div>
    </div>
    <div class="chart-card">
      <div class="cc-head"><div class="cc-title"><i class="ti ti-device-mobile"></i> แพลตฟอร์ม</div></div>
      <div style="position:relative;height:200px"><canvas id="cPlatform" role="img" aria-label="Platform chart">Platform</canvas></div>
      <div class="legend" id="platLegend"></div>
    </div>
    <div class="chart-card">
      <div class="cc-head"><div class="cc-title"><i class="ti ti-layout-columns"></i> Content Pillar</div></div>
      <div style="position:relative;height:210px"><canvas id="cPillar" role="img" aria-label="Pillar chart">Pillar</canvas></div>
    </div>
    <div class="chart-card">
      <div class="cc-head"><div class="cc-title"><i class="ti ti-users"></i> ผู้จัดทำ</div></div>
      <div style="position:relative;height:210px"><canvas id="cCreator" role="img" aria-label="Creator chart">Creator</canvas></div>
    </div>
  </div>

  <div class="table-section">
    <div class="table-header">
      <div class="t-title"><i class="ti ti-list-details"></i> รายการทั้งหมด</div>
      <div class="t-count" id="tCount"></div>
    </div>
    <div class="table-wrap">
      <table>
        <colgroup><col class="c-img"><col class="c-name"><col class="c-status"><col class="c-plat"><col class="c-date"><col class="c-pillar"><col class="c-creator"></colgroup>
        <thead><tr><th>รูป</th><th>ชื่อคอนเทนต์</th><th>Status</th><th>Platform</th><th>วันโพสต์</th><th>Pillar</th><th>ผู้จัดทำ</th></tr></thead>
        <tbody id="tbody"><tr class="state-row"><td colspan="7"><i class="ti ti-loader"></i> กำลังโหลด...</td></tr></tbody>
      </table>
    </div>
    <div class="pager">
      <span id="pagerInfo"></span>
      <div class="pager-btns" id="pagerBtns"></div>
    </div>
  </div>

</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
    <img class="modal-img" id="mImg" src="" alt="">
    <div class="modal-name" id="mName"></div>
    <div class="modal-meta" id="mMeta"></div>
    <div class="modal-link" id="mLink"></div>
  </div>
</div>

<script>
const PG = 15;
const SC = {'Idea':'#888780','Brief':'#EF9F27','รับทราบ':'#F09595','Editing':'#D85A30','Ready for review':'#7F77DD','In review':'#D4537E','ตรวจแล้ว รอโพสต์':'#1D9E75','Scheduled':'#378ADD','Published':'#639922','On hold':'#B4B2A9'};
const PC = {'Facebook':'#1877f2','Tiktok':'#222222','Instagram':'#E1306C','shopee':'#FF6900'};
const PIL_C = ['#E24B4A','#222222','#555555','#888780','#B4B2A9','#D3D1C7','#EF9F27'];
let all=[], fil=[], page=1, ci={};

const pct = (n,t) => t ? Math.round(n/t*100)+'%' : '0%';
const sClass = s => ({'Idea':'s-idea','Brief':'s-brief','Editing':'s-editing','Ready for review':'s-review','In review':'s-review','Published':'s-published','Scheduled':'s-scheduled','On hold':'s-onhold','รับทราบ':'s-rab','ตรวจแล้ว รอโพสต์':'s-truat'}[s]||'s-idea');
const ptag = p => `<span class="ptag ${({'Facebook':'pt-fb','Tiktok':'pt-tt','Instagram':'pt-ig','shopee':'pt-sh'}[p]||'')}">${p}</span>`;
const dc = id => { try { ci[id]&&ci[id].destroy(); delete ci[id]; } catch(e){} };

async function loadData() {
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> กำลังโหลด...';
  document.getElementById('tsBar').textContent = 'กำลังดึงข้อมูลจาก Notion...';
  try {
    const res = await fetch('/.netlify/functions/notion');
    if (!res.ok) throw new Error(`Error ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    all = data.results;
    populateFilters();
    applyFilter();
    document.getElementById('tsBar').textContent = `อัปเดตล่าสุด ${new Date().toLocaleString('th-TH')} · ${all.length} รายการ`;
  } catch(err) {
    document.getElementById('tsBar').textContent = 'โหลดไม่สำเร็จ: ' + err.message;
    document.getElementById('tbody').innerHTML = `<tr class="error-row"><td colspan="7"><i class="ti ti-alert-circle"></i> ${err.message}</td></tr>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-refresh"></i> Refresh';
  }
}

function populateFilters() {
  const st = [...new Set(all.map(d=>d.status).filter(Boolean))];
  document.getElementById('fStatus').innerHTML = '<option value="">ทุก Status</option>' + st.map(s=>`<option>${s}</option>`).join('');
  const pi = [...new Set(all.flatMap(d=>d.pillar))].filter(Boolean);
  document.getElementById('fPillar').innerHTML = '<option value="">ทุก Pillar</option>' + pi.map(p=>`<option>${p}</option>`).join('');
  const cr = [...new Set(all.flatMap(d=>d.creator))].filter(Boolean);
  document.getElementById('fCreator').innerHTML = '<option value="">ทุก ผู้จัดทำ</option>' + cr.map(c=>`<option>${c}</option>`).join('');
}

function applyFilter() {
  const st=document.getElementById('fStatus')?.value||'';
  const pl=document.getElementById('fPlatform')?.value||'';
  const pi=document.getElementById('fPillar')?.value||'';
  const cr=document.getElementById('fCreator')?.value||'';
  fil = all.filter(d => {
    if(st && d.status!==st) return false;
    if(pl && !d.platform.includes(pl)) return false;
    if(pi && !d.pillar.includes(pi)) return false;
    if(cr && !d.creator.includes(cr)) return false;
    return true;
  });
  page=1;
  const active=[st,pl,pi,cr].filter(Boolean).length;
  document.getElementById('filterCount').textContent = active ? `กรองแล้ว: ${fil.length} จาก ${all.length}` : '';
  renderMetrics(); renderCharts(); renderTable();
}

function clearFilters() {
  ['fStatus','fPlatform','fPillar','fCreator'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  applyFilter();
}

function renderMetrics() {
  const total=fil.length, pub=fil.filter(d=>d.status==='Published').length;
  const inp=fil.filter(d=>['Brief','Editing','Ready for review','In review','รับทราบ'].includes(d.status)).length;
  const sch=fil.filter(d=>['Scheduled','ตรวจแล้ว รอโพสต์'].includes(d.status)).length;
  document.getElementById('metrics').innerHTML = [
    {label:'TOTAL CONTENT',val:total,p:'',color:'#E24B4A',fill:100},
    {label:'PUBLISHED',val:pub,p:pct(pub,total),color:'#639922',fill:Math.round(pub/Math.max(total,1)*100)},
    {label:'IN PROGRESS',val:inp,p:pct(inp,total),color:'#378ADD',fill:Math.round(inp/Math.max(total,1)*100)},
    {label:'SCHEDULED',val:sch,p:pct(sch,total),color:'#EF9F27',fill:Math.round(sch/Math.max(total,1)*100)},
  ].map(m=>`<div class="mc"><div class="mc-top" style="background:${m.color}"></div><div class="mc-label">${m.label}</div><div class="mc-val">${m.val}</div>${m.p?`<div class="mc-pct" style="color:${m.color}">${m.p}</div>`:''}<div class="mc-bar-wrap"><div class="mc-bar-fill" style="width:${m.fill}%;background:${m.color}"></div></div></div>`).join('');
}

function renderCharts() {
  const tC='#888888', grid='rgba(0,0,0,0.05)';
  const sCt={};fil.forEach(d=>{if(d.status)sCt[d.status]=(sCt[d.status]||0)+1;});
  const sK=Object.keys(sCt).sort((a,b)=>sCt[b]-sCt[a]),sT=sK.reduce((s,k)=>s+sCt[k],0);
  dc('cStatus');
  ci['cStatus']=new Chart(document.getElementById('cStatus'),{type:'doughnut',data:{labels:sK,datasets:[{data:sK.map(k=>sCt[k]),backgroundColor:sK.map(k=>SC[k]||'#ccc'),borderWidth:2,borderColor:'#fff',hoverBorderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${ctx.raw} (${Math.round(ctx.raw/sT*100)}%)`}}}}});
  document.getElementById('statusTotal').textContent=`${sT} รายการ`;
  document.getElementById('statusLegend').innerHTML=sK.map(k=>`<span class="legend-item"><span class="legend-dot" style="background:${SC[k]||'#ccc'}"></span>${k} <span class="legend-val">${sCt[k]}</span> <span class="legend-pct">(${Math.round(sCt[k]/sT*100)}%)</span></span>`).join('');

  const pCt={};fil.forEach(d=>d.platform.forEach(p=>{pCt[p]=(pCt[p]||0)+1;}));
  const pK=Object.keys(pCt).sort((a,b)=>pCt[b]-pCt[a]),pT=pK.reduce((s,k)=>s+pCt[k],0);
  dc('cPlatform');
  ci['cPlatform']=new Chart(document.getElementById('cPlatform'),{type:'bar',data:{labels:pK,datasets:[{data:pK.map(k=>pCt[k]),backgroundColor:pK.map(k=>PC[k]||'#E24B4A'),borderRadius:5,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.raw} โพสต์ (${Math.round(ctx.raw/pT*100)}%)`}}},scales:{x:{grid:{display:false},ticks:{color:tC,font:{size:11}}},y:{grid:{color:grid},ticks:{color:tC,font:{size:10},stepSize:1},border:{display:false}}}}});
  document.getElementById('platLegend').innerHTML=pK.map(k=>`<span class="legend-item"><span class="legend-dot" style="background:${PC[k]||'#E24B4A'}"></span>${k} <span class="legend-val">${pCt[k]}</span> <span class="legend-pct">(${Math.round(pCt[k]/Math.max(pT,1)*100)}%)</span></span>`).join('');

  const piCt={};fil.forEach(d=>d.pillar.forEach(p=>{piCt[p]=(piCt[p]||0)+1;}));
  const piK=Object.keys(piCt).sort((a,b)=>piCt[b]-piCt[a]),piT=piK.reduce((s,k)=>s+piCt[k],0);
  dc('cPillar');
  ci['cPillar']=new Chart(document.getElementById('cPillar'),{type:'bar',data:{labels:piK,datasets:[{data:piK.map(k=>piCt[k]),backgroundColor:piK.map((_,i)=>PIL_C[i%PIL_C.length]),borderRadius:4,borderSkipped:false}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.raw} (${Math.round(ctx.raw/piT*100)}%)`}}},scales:{x:{grid:{color:grid},ticks:{color:tC,font:{size:10},stepSize:1},border:{display:false}},y:{grid:{display:false},ticks:{color:tC,font:{size:11},crossAlign:'far'}}}}});

  const crCt={};fil.forEach(d=>d.creator.forEach(c=>{crCt[c]=(crCt[c]||0)+1;}));
  const crK=Object.keys(crCt).sort((a,b)=>crCt[b]-crCt[a]),crT=crK.reduce((s,k)=>s+crCt[k],0);
  dc('cCreator');
  ci['cCreator']=new Chart(document.getElementById('cCreator'),{type:'bar',data:{labels:crK,datasets:[{data:crK.map(k=>crCt[k]),backgroundColor:'#E24B4A',borderRadius:4,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.raw} ชิ้น (${Math.round(ctx.raw/crT*100)}%)`}}},scales:{x:{grid:{display:false},ticks:{color:tC,font:{size:11}}},y:{grid:{color:grid},ticks:{color:tC,font:{size:10},stepSize:1},border:{display:false}}}}});
}

function renderTable() {
  const start=(page-1)*PG, slice=fil.slice(start,start+PG);
  document.getElementById('tCount').textContent=`${fil.length} รายการ`;
  document.getElementById('tbody').innerHTML = slice.length===0
    ? '<tr class="state-row"><td colspan="7">ไม่พบข้อมูล</td></tr>'
    : slice.map(d=>{
        const plats=d.platform.map(ptag).join('');
        const pillars=d.pillar.map(p=>`<span class="badge" style="background:#f1f1f1;color:#444;margin-right:2px">${p}</span>`).join('');
        const img=d.image_url
          ?`<img class="img-thumb" src="${d.image_url}" alt="thumb" onclick="showModal(${JSON.stringify(d).replace(/</g,'&lt;')})">`
          :`<div class="img-ph"><i class="ti ti-photo" style="font-size:14px"></i></div>`;
        return `<tr><td>${img}</td><td><a class="content-link" href="${d.page_url}" target="_blank">${d.name||'—'}</a></td><td><span class="badge ${sClass(d.status)}">${d.status||'—'}</span></td><td>${plats||'—'}</td><td style="color:#888;font-size:11px">${d.publish_date||'—'}</td><td>${pillars||'—'}</td><td style="color:#888;font-size:11px">${d.creator.join(', ')||'—'}</td></tr>`;
      }).join('');
  renderPager();
}

function renderPager() {
  const total=Math.ceil(fil.length/PG), s=(page-1)*PG+1, e=Math.min(page*PG,fil.length);
  document.getElementById('pagerInfo').textContent=fil.length?`แสดง ${s}–${e} จาก ${fil.length}`:'';
  const btns=document.getElementById('pagerBtns');
  if(total<=1){btns.innerHTML='';return;}
  let h=`<button class="pb" onclick="goPage(${page-1})" ${page===1?'disabled':''}>‹</button>`;
  for(let i=1;i<=total;i++){
    if(i===1||i===total||Math.abs(i-page)<=1) h+=`<button class="pb ${i===page?'act':''}" onclick="goPage(${i})">${i}</button>`;
    else if(Math.abs(i-page)===2) h+='<span style="padding:0 3px;color:#ccc">…</span>';
  }
  h+=`<button class="pb" onclick="goPage(${page+1})" ${page===total?'disabled':''}>›</button>`;
  btns.innerHTML=h;
}
function goPage(p){const t=Math.ceil(fil.length/PG);if(p<1||p>t)return;page=p;renderTable();}

function showModal(d) {
  if (typeof d === 'string') d = JSON.parse(d);
  document.getElementById('mImg').src = d.image_url||'';
  document.getElementById('mImg').style.display = d.image_url ? 'block' : 'none';
  document.getElementById('mName').textContent = d.name||'';
  document.getElementById('mMeta').innerHTML = `<span class="badge ${sClass(d.status)}">${d.status}</span>${d.platform.map(ptag).join('')}<span style="font-size:11px">${d.publish_date||''}</span>`;
  document.getElementById('mLink').innerHTML = d.page_url ? `<a href="${d.page_url}" target="_blank"><i class="ti ti-external-link" style="font-size:13px"></i> ดูใน Notion</a>` : '';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

loadData();
</script>
